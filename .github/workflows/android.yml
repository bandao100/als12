name: Application Android

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Clé de signature facultative : sans elle, l'APK est signé avec une clé de débogage.
      - name: Préparer la clé de signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sentinelle.keystore"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/sentinelle.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Vérifier le contenu de l'APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -q "assets/www/index.html"
          unzip -l "$APK" | grep -q "assets/www/js/core/native.js"
          cp "$APK" sentinelle.apk
          ls -l sentinelle.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sentinelle-apk
          path: sentinelle.apk

      - name: Publier l'APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create android sentinelle.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sentinelle pour Android" \
            --notes "APK pour Android 8 ou plus récent, conçu pour le Samsung Galaxy S25 Ultra. Sur le téléphone : téléchargez sentinelle.apk, ouvrez-le, autorisez l'installation depuis cette source, puis installez."
