name: Ticket Secure Pro — tests

on:
  push:
    paths: ["ticket-secure-pro/**", ".github/workflows/ticket-secure-pro-tests.yml"]
  pull_request:
    paths: ["ticket-secure-pro/**", ".github/workflows/ticket-secure-pro-tests.yml"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ticket-secure-pro
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketapp
          POSTGRES_PASSWORD: ticketapp
          POSTGRES_DB: ticketsecure_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ticketapp" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ticket-secure-pro/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL, dont la validation concurrente)
        env:
          TEST_DATABASE_URL: postgresql://ticketapp:ticketapp@localhost:5432/ticketsecure_test
        run: pytest -q
      - name: Migrations à jour avec les modèles
        env:
          DATABASE_URL: postgresql://ticketapp:ticketapp@localhost:5432/ticketsecure_test
          FLASK_APP: wsgi.py
        run: |
          psql postgresql://ticketapp:ticketapp@localhost:5432/ticketsecure_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          flask bootstrap
          flask db check
