name: APK Android

on:
  push:
    paths:
      - "reseau-monitor/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Compiler l'APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reseau-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilation
        run: ./gradlew --no-daemon assembleDebug

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk surveillance-reseau.apk

      - uses: actions/upload-artifact@v4
        with:
          name: surveillance-reseau-apk
          path: reseau-monitor/surveillance-reseau.apk
          if-no-files-found: error
