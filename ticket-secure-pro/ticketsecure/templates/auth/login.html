{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<section class="auth card">
  <div class="eyebrow">ESPACE ORGANISATEUR ET CONTRÔLEURS</div>
  <h1>Connexion</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>E-mail<input type="email" name="email" autocomplete="username" required autofocus></label>
    <label>Mot de passe<input type="password" name="password" autocomplete="current-password" required></label>
    <button>Se connecter</button>
  </form>
  <p class="muted"><a href="{{ url_for('auth.forgot_password') }}">Mot de passe oublié ?</a></p>
  <p class="muted">Vous organisez des événements ? <a href="{{ url_for('auth.register') }}">Créer votre espace</a></p>
</section>
{% endblock %}
