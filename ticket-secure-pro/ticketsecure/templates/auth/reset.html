{% extends "base.html" %}
{% block title %}Nouveau mot de passe{% endblock %}
{% block content %}
<section class="auth card">
  <div class="eyebrow">RÉCUPÉRATION</div>
  <h1>Nouveau mot de passe</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nouveau mot de passe (12 caractères minimum)<input type="password" name="password" minlength="12" autocomplete="new-password" required></label>
    <label>Confirmation<input type="password" name="confirm" minlength="12" autocomplete="new-password" required></label>
    <button>Enregistrer</button>
  </form>
</section>
{% endblock %}
