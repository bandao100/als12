<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F4E78">
  <meta name="application-name" content="Aurore">
  <title>Aurore — Suivi budgétaire</title>
  <link rel="icon" href="icone.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header class="barre-haut">
      <div class="barre-haut-texte">
        <h1 id="titre">Colombe 3</h1>
        <p id="sous-titre"></p>
      </div>
      <div id="actions-haut" class="actions-haut"></div>
    </header>

    <main id="vue" tabindex="-1"></main>

    <nav class="barre-bas" aria-label="Navigation principale">
      <button class="onglet" data-action="onglet" data-onglet="accueil">
        <svg class="ico"><use href="#i-accueil"/></svg><span>Accueil</span>
      </button>
      <button class="onglet" data-action="onglet" data-onglet="postes">
        <svg class="ico"><use href="#i-liste"/></svg><span>Postes</span>
      </button>
      <button class="onglet-ajout" data-action="ajouter" aria-label="Ajouter un paiement ou une dépense">
        <svg class="ico"><use href="#i-plus"/></svg>
      </button>
      <button class="onglet" data-action="onglet" data-onglet="historique">
        <svg class="ico"><use href="#i-horloge"/></svg><span>Historique</span>
      </button>
      <button class="onglet" data-action="onglet" data-onglet="plus">
        <svg class="ico"><use href="#i-menu"/></svg><span>Plus</span>
      </button>
    </nav>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="fichier-import" accept=".json,application/json,text/plain,*/*" hidden>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-accueil" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></symbol>
      <symbol id="i-liste" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M3.5 6h1M3.5 12h1M3.5 18h1"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-horloge" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
      <symbol id="i-recherche" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5L16 16"/></symbol>
      <symbol id="i-partage" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.4 13.3l7.2 4.3M15.6 6.4l-7.2 4.3"/></symbol>
      <symbol id="i-crayon" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></symbol>
      <symbol id="i-poubelle" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
      <symbol id="i-coche" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-fermer" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-retour" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-telecharger" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-importer" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></symbol>
      <symbol id="i-tableur" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/></symbol>
      <symbol id="i-personne" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
      <symbol id="i-billet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6.5 9.5v5M17.5 9.5v5"/></symbol>
      <symbol id="i-dossier" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></symbol>
      <symbol id="i-recu" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
      <symbol id="i-annuler" viewBox="0 0 24 24"><path d="M4 10h11a5 5 0 010 10H9"/><path d="M8 6l-4 4 4 4"/></symbol>
      <symbol id="i-alerte" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></symbol>
    </defs>
  </svg>

  <script src="donnees-initiales.js"></script>
  <script src="app.js"></script>
</body>
</html>
